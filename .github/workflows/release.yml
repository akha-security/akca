name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release whose binaries will be rebuilt from the selected workflow ref'
        required: true
        default: 'v0.3.0'
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: akca-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: akca-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: akca-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            artifact: akca-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: akca-darwin-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go.sum

      - name: Build
        working-directory: engine
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          build_date="$(git show -s --format=%cI "${GITHUB_SHA}")"
          go build -buildvcs=false -trimpath -ldflags="-s -w -X github.com/akha-security/akca/engine/internal/branding.CommitSHA=${GITHUB_SHA} -X github.com/akha-security/akca/engine/internal/branding.BuildDate=${build_date}" -o "../dist/${{ matrix.artifact }}" ./cmd/akca

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: akca-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum akca-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi
          # Manual refreshes only replace an existing release's assets. The
          # published source/module tags are never moved or created here.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release view "${RELEASE_TAG}" >/dev/null
          fi
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ -f "${notes_file}" ]; then
              gh release edit "${RELEASE_TAG}" --title "AKCA ${RELEASE_TAG}" --notes-file "${notes_file}"
            fi
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          elif [ -f "${notes_file}" ]; then
            gh release create "${RELEASE_TAG}" dist/* --title "AKCA ${RELEASE_TAG}" --notes-file "${notes_file}" --verify-tag
          else
            gh release create "${RELEASE_TAG}" dist/* --title "AKCA ${RELEASE_TAG}" --generate-notes --verify-tag
          fi
