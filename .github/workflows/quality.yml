name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: engine/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: |
          packages="$(go list ./... | grep -v '/internal/resilience$')"
          # Race instrumentation deliberately changes scheduling and request
          # totals in the adaptive end-to-end benchmark. The same strict
          # quality gate runs uninstrumented in the next step; keep this step
          # focused on detecting data races in the remaining test corpus.
          go test -race -skip '^(TestBenchmarkCommandWritesObservedJSON|TestLabRunAll)$' ${packages}
          go test -race -short ./internal/resilience
      - name: Operational observed benchmark gate
        run: go run ./cmd/akca benchmark --db "${RUNNER_TEMP}/akca-benchmark.db" --output benchmark-quality.json --strict
      - name: Complete-corpus coverage audit
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: go run ./cmd/akca benchmark --db "${RUNNER_TEMP}/akca-release-benchmark.db" --output benchmark-release-quality.json --complete-corpus
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akca-benchmark-quality
          path: |
            engine/benchmark-quality.json
            engine/benchmark-release-quality.json
